timezone: "Asia/Shanghai"
lock_ttl: 46m
jobs:
  - name: region.sync
    spec: "0 3 1 * *"
    desc: "同步民政部行政区划数据"
    timeout: 45m
    enabled: true
  - name: media.cleanup_orphans
    spec: "15 * * * *"
    desc: "清理未绑定的孤儿媒体"
    timeout: 10m
    enabled: true
  - name: ad.mark_expired
    spec: "* * * * *"
    desc: "将已过投放结束时间的广告标记为已结束"
    timeout: 1m
    enabled: true
