x-server: &server
  platform: linux/amd64
  build:
    context: ./chat-server
    dockerfile: Dockerfile
  env_file:
    - path: ./chat-server/configs/.env
      required: false
  restart: unless-stopped
  volumes:
    - chat-server-data:/app/data
    - chat-server-logs:/app/logs
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  mysql:
    platform: linux/amd64
    image: mysql:8.0
    container_name: chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: app
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - chat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
  redis:
    platform: linux/amd64
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chat-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    platform: linux/amd64
    build:
      context: ./chat-server
      dockerfile: Dockerfile
    container_name: chat-migrate
    env_file:
      - path: ./chat-server/configs/.env
        required: false
    command: ["/app/migration"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
  server-1:
    <<: *server
    container_name: chat-server-1
    hostname: chat-server-1
  server-2:
    <<: *server
    container_name: chat-server-2
    hostname: chat-server-2
  server-3:
    <<: *server
    container_name: chat-server-3
    hostname: chat-server-3
  worker:
    platform: linux/amd64
    build:
      context: ./chat-server
      dockerfile: Dockerfile
    container_name: chat-worker
    hostname: chat-worker
    env_file:
      - path: ./chat-server/configs/.env
        required: false
    command: ["/app/worker"]
    restart: unless-stopped
    volumes:
      - chat-server-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  admin:
    platform: linux/amd64
    build:
      context: ./chat-admin
      dockerfile: Dockerfile
    container_name: chat-admin
    restart: unless-stopped
    expose:
      - "80"
  h5:
    platform: linux/amd64
    build:
      context: ./chat-h5
      dockerfile: Dockerfile
    container_name: chat-h5
    restart: unless-stopped
    expose:
      - "80"
  gateway:
    platform: linux/amd64
    image: nginx:1.27-alpine
    container_name: chat-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      admin:
        condition: service_started
      h5:
        condition: service_started
volumes:
  chat-mysql-data:
  chat-redis-data:
  chat-server-data:
  chat-server-logs:
